
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Define a codificação dos caracteres -->
    <meta charset="UTF-8">

    <!-- Ajusta a página para celulares e computadores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece na aba do navegador -->
    <title>Meus sites favoritos</title>

    <!-- Conecta o arquivo CSS ao HTML -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Título principal da página -->
    <header>
        <h1>Meus sites favoritos: Ana Clara</h1>
        <p>Uma seleção dos meus sites preferidos!</p>
    </header>

    <!-- Área que apresenta os cinco sites -->
    <main class="container">

        <!-- Primeiro site: Google -->
        <section class="site">
            <h2>Google</h2>
            <img src="https://www.google.com/s2/favicons?domain=google.com&sz=128" alt="Logo do Google">
            <a href="https://www.google.com" target="_blank">Acessar Google</a>
        </section>

        <!-- Segundo site: YouTube -->
        <section class="site">
            <h2>YouTube</h2>
            <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128" alt="Logo do YouTube">
            <a href="https://www.youtube.com" target="_blank">Acessar YouTube</a>
        </section>

        <!-- Terceiro site: Canva -->
        <section class="site">
            <h2>Canva</h2>
            <img src="https://www.google.com/s2/favicons?domain=canva.com&sz=128" alt="Logo do Canva">
            <a href="https://www.canva.com" target="_blank">Acessar Canva</a>
        </section>

        <!-- Quarto site: Wikipedia -->
        <section class="site">
            <h2>Wikipedia</h2>
            <img src="https://www.google.com/s2/favicons?domain=wikipedia.org&sz=128" alt="Logo da Wikipedia">
            <a href="https://www.wikipedia.org" target="_blank">Acessar Wikipedia</a>
        </section>

        <!-- Quinto site: Pinterest -->
        <section class="site">
            <h2>Pinterest</h2>
            <img src="https://www.google.com/s2/favicons?domain=pinterest.com&sz=128" alt="Logo do Pinterest">
            <a href="https://www.pinterest.com" target="_blank">Acessar Pinterest</a>
        </section>

    </main>

    <!-- Rodapé da página -->
    <footer>
        <p>Projeto desenvolvido por Ana Clara.</p>
    </footer>

</body>
</html>
